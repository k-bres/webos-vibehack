name: webOS Launcher
version: "1.3.0"
# Kept from the original name: changing it makes a new add-on and loses /data and addon_configs.
slug: webos_vibehack
description: Apple TV-style home screen for LG TVs. Installs it, sends Home to it, keeps Developer Mode alive.
url: https://github.com/k-bres/webos-ha-launcher
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
map:
  - addon_config:rw
options:
  tv_host: ""
  passphrase: ""
  install_on_start: true
schema:
  tv_host: str
  passphrase: password
  install_on_start: bool
