name: webOS vibehack
version: "1.1.2"
slug: webos_vibehack
description: Apple TV-style launcher for LG TVs. Installs it, sends Home to it, keeps Developer Mode alive.
url: https://github.com/k-bres/webos-vibehack
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
map:
  - addon_config:rw
options:
  tv_host: ""
  passphrase: ""
  install_on_start: true
schema:
  tv_host: str
  passphrase: password
  install_on_start: bool
